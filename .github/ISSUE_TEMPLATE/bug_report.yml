name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this bug could make a real aircraft unsafe (bypassing a safety check, fly-away, hijack), please report it privately instead. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Simulator, Real drone, Docker]
    validations:
      required: true
  - type: input
    id: drone
    attributes:
      label: Drone model (if real hardware)
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: e.g. Ubuntu 24.04, Python 3.12
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: From the logs/ folder.
      render: text
